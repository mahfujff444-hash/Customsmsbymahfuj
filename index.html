<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom SMS Sender</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { display: block; margin: 15px 0 5px; font-weight: bold; }
        input, textarea, select, button { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        button { background: #28a745; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #218838; }
        .success { color: #155724; background: #d4edda; padding: 12px; border-radius: 6px; margin: 15px 0; }
        .error { color: #721c24; background: #f8d7da; padding: 12px; border-radius: 6px; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📱 Custom SMS Sender</h2>
        
        <div id="status"></div>

        <form id="smsForm">
            <label>প্রোভাইডার নির্বাচন করুন:</label>
            <select name="provider" id="provider">
                <option value="api1">API 1 - devbd.my.id</option>
                <option value="api2">API 2 - darktube.serv00.net</option>
            </select>

            <label>ফোন নম্বর:</label>
            <input type="text" id="phone" placeholder="01866184669" required>

            <label>মেসেজ লিখুন:</label>
            <textarea id="message" rows="5" placeholder="আপনার মেসেজ এখানে..." required></textarea>

            <button type="submit">🚀 SMS পাঠান</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('smsForm');
        const statusDiv = document.getElementById('status');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const provider = document.getElementById('provider').value;
            const phone = document.getElementById('phone').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!phone || !message) {
                showStatus('ফোন নম্বর ও মেসেজ দিতে হবে!', 'error');
                return;
            }

            showStatus('পাঠানো হচ্ছে...', 'info');

            let url = '';

            if (provider === 'api1') {
                url = `https://devbd.my.id/sms.php?key=AM–MRXRPSh2PU&number=${encodeURIComponent(phone)}&msg=${encodeURIComponent(message)}`;
            } else {
                url = `https://darktube.serv00.net/api?api_key=SMS_6079418217_ec2b63e94e054c563b3eaabdc39246ab&number=${encodeURIComponent(phone)}&message=${encodeURIComponent(message)}`;
            }

            try {
                const response = await fetch(url, { method: 'GET' });
                const text = await response.text();

                if (response.ok || text.toLowerCase().includes('success')) {
                    showStatus('✅ SMS সফলভাবে পাঠানো হয়েছে!', 'success');
                } else {
                    showStatus('❌ SMS পাঠাতে সমস্যা হয়েছে।', 'error');
                }
            } catch (err) {
                showStatus('❌ নেটওয়ার্ক সমস্যা হয়েছে।', 'error');
            }
        });

        function showStatus(msg, type) {
            statusDiv.innerHTML = `<div class="${type}">${msg}</div>`;
        }
    </script>
</body>
</html>
