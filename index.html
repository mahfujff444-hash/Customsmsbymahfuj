<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAHFUJ CUSTOM SMS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .api-select {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .api-box {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .api-box.active {
            border-color: #28a745;
            background: #e8f5e9;
        }
        label { display: block; margin: 15px 0 8px; font-weight: 600; color: #444; }
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 16px;
            background: #28a745;
            color: white;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        button:hover { background: #218838; transform: translateY(-2px); }
        button:disabled { background: #999; cursor: not-allowed; }

        .success { 
            color: #155724; 
            background: #d4edda; 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center;
            animation: pop 0.5s;
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 MAHFUJ CUSTOM SMS</h1>
        
        <div id="status"></div>

        <form id="smsForm">
            <label>প্রোভাইডার নির্বাচন করুন:</label>
            <div class="api-select">
                <div class="api-box active" data-provider="api1" id="box1">
                    <strong>015XXXXXXXX</strong>
                </div>
                <div class="api-box" data-provider="api2" id="box2">
                    <strong>EnsureGroup</strong>
                </div>
            </div>

            <label>ফোন নম্বর:</label>
            <input type="text" id="phone" placeholder="01866184669" required>

            <label>মেসেজ লিখুন:</label>
            <textarea id="message" rows="5" placeholder="আপনার মেসেজ এখানে লিখুন..." required></textarea>

            <button type="submit" id="sendBtn">🚀 SMS পাঠান</button>
        </form>
    </div>

    <script src="index.js"></script>
</body>
</html>
