<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAHFUJ SMS PANEL</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#050b18;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

canvas{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.box{
width:350px;
background:rgba(0,0,0,.45);
backdrop-filter:blur(12px);
border:1px solid #00ff88;
border-radius:18px;
padding:20px;
box-shadow:0 0 20px #00ff88;
}

h2{
color:#00ff88;
text-align:center;
margin-bottom:15px;
}

input,textarea,select{
width:100%;
padding:12px;
margin-top:10px;
background:#111;
color:#fff;
border:1px solid #00ff88;
border-radius:10px;
outline:none;
}

textarea{
height:110px;
resize:none;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#00ff88;
border:none;
border-radius:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
box-shadow:0 0 20px #00ff88;
}

#popup{
display:none;
margin-top:15px;
padding:10px;
border-radius:8px;
text-align:center;
color:#fff;
}

.success{
background:#16a34a;
}

.error{
background:#dc2626;
}
</style>

</head>

<body>

<canvas id="matrix"></canvas>

<div class="box">

<h2>MAHFUJ SMS PANEL</h2>

<select id="provider">
<option value="1">API 1</option>
<option value="2">API 2</option>
</select>

<input type="text" id="number" placeholder="018XXXXXXXX">

<textarea id="message" placeholder="Write Message"></textarea>

<button onclick="sendSMS()">🚀 SEND SMS</button>

<div id="popup"></div>

</div>

<script src="index.js"></script>

</body>
</html>
